<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR + Webcam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #qr {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      padding: 8px;
    }

    #videoContainer {
      flex: 1 1 auto;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="qr">
      <img src="https://api.qrserver.com/v1/create-qr-code/?data=HelloWorld&size=100x100" alt="QR Code" />
    </div>
    <div id="videoContainer">
      <video id="webcam" autoplay playsinline></video>
    </div>
  </div>

  <script>
    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('webcam').srcObject = stream;
      } catch (err) {
        console.error('Failed to start webcam', err);
      }
    }

    startWebcam();
  </script>
</body>
</html>
