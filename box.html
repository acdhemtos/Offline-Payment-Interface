<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR + Webcam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
    }
    body>div{
      width:100vw;
      position:relative;
    }
    #qr{
      height:100vw;
      background-color:black;
    }
    #details{
      display:flex;
      justify-content:space-around;
      align-items:center;
      height:calc(100vh - 100vw);
    }
    #details.camera>#camera{
      display:block;
    }
    #details.green{
      background-color:green;
    }
    #details.yellow{
      background-color:yellow;
    }
    #details.red{
      background-color:red;
    }
    #camera{
      display:none;
      position:absolute;
      background-color: blue;
      left:0;
      right:0;
      bottom:0;
      top:0;
    }
    #details:not(.camera)>#info{
      display:block;
    }
    #info{
      display:none;
      position:absolute;
      padding:10px;
      top:10px;
      left:10px;
      right:10px;
      bottom:10px;
      border-radius:5px;
      background-color:rgba(255,255,255,0.5);
      text-align:Center;
      font-weight:bold;
      font-size:1.5em;
      line-height:calc(100vh - 100vw - 20px);
    }
    #details.green>#info:before{
      content:"Transaction Successful!";
      color:green;
    }
  </style>
</head>
<body>
  
  <div id="qr">

  </div>
  <div id="details" class="green">
    <div id="camera"></div>
    <div id="info"></div>
  </div>
  </body>
</body>
</html>
