<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR + Webcam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
    }
    body>div{
      width:100vw;
      position:relative;
    }
    #qr{
      height:100vw;
      background-color:black;
    }
    #details{
      height:calc(100vh - 100vw);
    }
    #details.camera>#camera{
      display:default;
    }
    #camera{
      display:none;
      position:absolute;
      background-color: blue;
      left:0;
      right:0;
      bottom:0;
      top:0;
    }
  </style>
</head>
<body>
  
  <div id="qr">

  </div>
  <div id="details">
    <div id="camera">

    </div>
  </div>
  </body>
</body>
</html>
