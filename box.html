<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR + Webcam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
    }
    body>div{
      width:100vw;
      position:relative;
    }
    #qr{
      height:100vw;
      background-color:black;
    }
    #details{
      display:flex;
      justify-content:space-around;
      align-items:center;
      height:calc(100vh - 100vw);
    }
    #details.green>#camera,#details.red>#camera,#details.yellow>#camera{
      display:none;
    }
    #details.green{
      background-color:green;
    }
    #details.yellow{
      background-color:yellow;
    }
    #details.red{
      background-color:mediumvioletred;
    }
    #camera{
      display:block;
      position:absolute;
      background-color: blue;
      left:0;
      right:0;
      bottom:0;
      top:0;
    }
    #details[class]>#info{
      display:block;
    }
    #info{
      display:none;
      position:absolute;
      padding:10px;
      top:10px;
      left:10px;
      right:10px;
      bottom:10px;
      border-radius:5px;
      background-color:rgba(255,255,255,0.5);
      text-align:Center;
      font-weight:bold;
      font-size:1.5em;
      line-height:calc(100vh - 100vw - 20px);
    }
    #details.green>#info:before{
      content:"Transaction Successful!";
      color:green;
    }
    #details.yellow>#info:before{
      content:"Processing!";
    }
    #details.red>#info:before{
      content:"Transaction Failed!";
      color:mediumvioletred;
    }
  </style>
</head>
<body>
  
  <div id="qr">

  </div>
  <div id="details">
    <video id="camera"></video>
    <div id="info" onclick="reset"></div>
  </div>
  <script>
    const video = document.getElementById('camera');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let username = "receiver";//prompt("Enter Username : ");
    let looking = false;

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, canvas.width, canvas.height);
        if (code && looking) {
          console.log(code);
        }
      }
      requestAnimationFrame(tick);
    }

    function setQR(str){
      console.log(str);
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(function (stream) {
        video.srcObject = stream;
        requestAnimationFrame(tick);
      });
    function reset(){
      document.getElementById('details').removeAttribute('class');
      //setQR
      looking = true;
    }
  </script>
  </body>
</body>
</html>
