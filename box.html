<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR + Webcam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      width: 100%;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #qr {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      padding: 8px;
    }

    #videoContainer {
      flex: 1 1 auto;
      background: black;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  
  <div id="qr">

  </div>
  <div id="details"></div>
  </body>
</body>
</html>
