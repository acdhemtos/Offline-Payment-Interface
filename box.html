<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Mirror</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: sans-serif;
    }

    #qr-container {
      width: 100vw;
      height:100vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }

    #qr-output {
      width: 100vw;
      height: 100vw;
    }

    #camera-container {
      flex: 1;
    }

    #reader {
      width: 100vw;
      height: calc(100vh - 100vw);
    }
    #reader>video{
      width:100vw;
      height:calc(100vh - 100vw);
      transform:scaleX(-1);
    }
    body[class] #camera-container>#reader{
      display:none;
    }
    body.yellow #qr-container img{
      display:none;
    }
    /*
    body yellow
      reader background yellow
    body green
      reader background green
    body red
      reader background red
    
    
    */
  </style>

  <!-- html5-qrcode scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- qrcode generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>

  <div id="qr-container">
    <img id="qr-output" src="" />
  </div>
  <div id="camera-container">
    <div id="reader"></div>
  </div>

  <script>
    const qrOutput = document.getElementById('qr-output');

    let looking = true;

    function generateQR(text) {
      const typeNumber = 0;
      const errorCorrectionLevel = 'H';
      const qr = qrcode(typeNumber, errorCorrectionLevel);
      qr.addData(text);
      qr.make();
      const imgTagString = qr.createImgTag(10);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = imgTagString;
      const img = tempDiv.querySelector('img');
      qrOutput.src = img.src;
    }

    function onScanSuccess(decodedText) {
      if(looking){
        //format match
        generateQR(decodedText);
      }
      
    }

    const html5QrCode = new Html5Qrcode("reader");
    Html5Qrcode.getCameras().then(devices => {
      if (devices && devices.length) {
        html5QrCode.start(
          { facingMode: "user" },
          {
            fps: 10
          },
          onScanSuccess
        ).catch(err => console.error("Start failed", err));
      }
    }).catch(err => console.error("Camera error", err));
  </script>
</body>
</html>
